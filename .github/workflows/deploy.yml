name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if commit should trigger deployment
        id: check_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"
          
          # Skip deployment if commit message starts with [LOGS]
          if [[ "$COMMIT_MSG" == "[LOGS]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping deployment - this is a log commit"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Proceeding with deployment"
          fi
      
      - name: Trigger PythonAnywhere Deployment
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          RESPONSE=$(curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '${{ toJson(github.event) }}' | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' | sed 's/^.* //')" \
            -d '${{ toJson(github.event) }}' \
            -w "\nHTTP_CODE:%{http_code}" \
            ${{ secrets.PYTHONANYWHERE_WEBHOOK_URL }})
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE/d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment failed with HTTP code $HTTP_CODE"
            exit 1
          fi
          
          # Check if response contains "ok" status
          if echo "$BODY" | grep -q '"status".*"ok"'; then
            echo "✓ Deployment successful!"
          else
            echo "⚠ Deployment may have issues - check logs"
          fi
      
      - name: Skip deployment
        if: steps.check_commit.outputs.skip == 'true'
        run: echo "Deployment skipped - log commit detected"