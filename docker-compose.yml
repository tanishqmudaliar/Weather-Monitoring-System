services:
  weather-app:
    build: .
    container_name: weather_monitoring_system
    ports:
      - "5000:5000"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - PYTHONANYWHERE_API_TOKEN=${PYTHONANYWHERE_API_TOKEN:-}
      - PYTHONANYWHERE_USERNAME=${PYTHONANYWHERE_USERNAME:-}
    env_file:
      - .env
    volumes:
      # Mount code for development (optional - remove for production)
      - .:/app
      # Persist logs
      - logs-data:/app/.github/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  logs-data:
